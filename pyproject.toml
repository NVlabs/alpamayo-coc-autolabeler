[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coc-autolabeling"
version = "2.0.0"
description = "Chain-of-Causation and Reasoning Scene Graph Autolabeling Pipeline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy>=2.1,<3", "pandas>=2.2.3,<4", "pydantic>=2.9,<3"]

[project.optional-dependencies]
pipeline = [
  "pyarrow",
  "PyYAML",
  "omegaconf",
  "hydra-core",
  "requests",
  "openai",
  "httpx",
  "tenacity",
  "torch",
  "tqdm",
  "opencv-python",
  "trajdata @ git+https://github.com/NVlabs/trajdata.git@coc_autolabeling-1.0.0",
]
streaming = [
  "pyarrow",
  "PyYAML",
  "requests",
  "torch",
  "scipy",
  "Pillow",
  "opencv-python",
]
qwen = ["qwen-vl-utils", "transformers", "vllm"]
dev = ["pytest", "pyright", "ruff", "build", "setuptools>=77", "wheel"]

[project.scripts]
meta-action-autolabel = "meta_action.data_labeling:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["coc_labeling*", "meta_action*", "rsg_labeling*"]

[tool.setuptools.package-data]
coc_labeling = [
  "config/*.yaml",
  "config/data/*.yaml",
  "config/data_loader/*.yaml",
  "config/misc/*.yaml",
]
rsg_labeling = ["**/*.yaml", "**/*.json", "**/*.md"]

[tool.setuptools.cmdclass]
build_py = "_coc_build_support.CheckedBuildPy"
sdist = "_coc_build_support.CheckedSdist"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/coc_validation_stage/eval_stage1_coc_evidence_vllm.py" = ["E501"]
"scripts/coc_validation_stage/eval_stage2_coc_behavior_vllm.py" = ["E501"]
"scripts/coc_validation_stage/eval_stage3_coc_causal_vllm.py" = ["E501"]
